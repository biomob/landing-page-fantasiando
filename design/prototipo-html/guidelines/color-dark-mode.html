<!-- @dsCard group="Colors" viewport="700x200" name="Dark mode" subtitle="Same semantic tokens, inverted scales — set data-theme=&quot;dark&quot; on html" -->
<!DOCTYPE html><html lang="pt-br"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);display:grid;grid-template-columns:1fr 1fr}.p{padding:20px;min-height:200px;box-sizing:border-box}.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-subtle);margin-bottom:10px}.card{border-radius:16px;padding:16px}.btn{display:inline-flex;padding:9px 16px;border-radius:999px;font-family:var(--font-display);font-weight:600;font-size:14px}</style></head>
<body><div data-theme="light" class="p" style="background:var(--bg-base);color:var(--text-body)"><div class="lbl">Claro</div><div class="card" style="background:var(--surface-card);border:1px solid var(--line-200)"><div style="font-family:var(--font-display);font-weight:600;font-size:18px;color:var(--text-strong)">Vestido Princesa Aurora</div><div style="font-size:13px;color:var(--text-muted);margin:4px 0 12px">R$ 129,90 · 3x sem juros</div><div style="display:flex;gap:8px"><span class="btn" style="background:var(--brand);color:var(--text-on-brand)">Comprar</span><span class="btn" style="background:var(--surface-card);color:var(--text-strong);border:1.5px solid var(--line-200)">Provar com IA</span></div></div></div><div data-theme="dark" class="p" style="background:var(--bg-base);color:var(--text-body)"><div class="lbl">Escuro</div><div class="card" style="background:var(--surface-card);border:1px solid var(--line-200)"><div style="font-family:var(--font-display);font-weight:600;font-size:18px;color:var(--text-strong)">Vestido Princesa Aurora</div><div style="font-size:13px;color:var(--text-muted);margin:4px 0 12px">R$ 129,90 · 3x sem juros</div><div style="display:flex;gap:8px"><span class="btn" style="background:var(--brand);color:var(--text-on-brand)">Comprar</span><span class="btn" style="background:var(--surface-card);color:var(--text-strong);border:1.5px solid var(--line-200)">Provar com IA</span></div></div></div></body></html>
