<!-- @dsCard group="Spacing" viewport="700x140" name="Spacing scale" subtitle="8px-based rhythm" -->
<!DOCTYPE html><html lang="pt-br"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-base);font-family:var(--font-body);color:var(--text-body);padding:22px}
  .row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
  .item{display:flex;flex-direction:column;align-items:center;gap:7px}
  .bar{background:var(--violet-300);border-radius:3px;width:100%}
  .box{width:48px;display:flex;flex-direction:column;align-items:center;gap:6px}
  .lbl{font-size:11px;font-weight:700}
  .val{font-size:10.5px;color:var(--text-muted)}
</style></head>
<body><div class="row">
  <div class="box"><div class="bar" style="height:4px"></div><div class="lbl">1</div><div class="val">4</div></div>
  <div class="box"><div class="bar" style="height:8px"></div><div class="lbl">2</div><div class="val">8</div></div>
  <div class="box"><div class="bar" style="height:12px"></div><div class="lbl">3</div><div class="val">12</div></div>
  <div class="box"><div class="bar" style="height:16px"></div><div class="lbl">4</div><div class="val">16</div></div>
  <div class="box"><div class="bar" style="height:24px"></div><div class="lbl">6</div><div class="val">24</div></div>
  <div class="box"><div class="bar" style="height:32px"></div><div class="lbl">8</div><div class="val">32</div></div>
  <div class="box"><div class="bar" style="height:48px"></div><div class="lbl">12</div><div class="val">48</div></div>
  <div class="box"><div class="bar" style="height:64px"></div><div class="lbl">16</div><div class="val">64</div></div>
</div></body></html>
