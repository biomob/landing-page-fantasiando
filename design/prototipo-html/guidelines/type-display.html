<!-- @dsCard group="Type" viewport="700x230" name="Display — Fredoka" subtitle="Rounded display face for headlines & titles" -->
<!DOCTYPE html><html lang="pt-br"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-base);font-family:var(--font-body);color:var(--text-strong);padding:22px 24px}
  .spec{display:flex;flex-direction:column;gap:10px}
  .line{display:flex;align-items:baseline;gap:14px}
  .tag{font-size:11px;color:var(--text-subtle);font-weight:700;min-width:96px;font-family:var(--font-body)}
  .d{font-family:var(--font-display);letter-spacing:-0.01em;line-height:1.05}
</style></head>
<body><div class="spec">
  <div class="line"><span class="tag">display-xl · 700</span><span class="d" style="font-size:46px;font-weight:700">A magia de escolher</span></div>
  <div class="line"><span class="tag">display-md · 600</span><span class="d" style="font-size:30px;font-weight:600">Veja antes de comprar</span></div>
  <div class="line"><span class="tag">title · 500</span><span class="d" style="font-size:21px;font-weight:500">Vestido Princesa Aurora</span></div>
</div></body></html>
