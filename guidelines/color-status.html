<!-- @dsCard group="Colors" viewport="700x140" name="Status & surfaces" subtitle="Semantic feedback colors + section surfaces" -->
<!DOCTYPE html><html lang="pt-br"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);font-family:var(--font-body);color:var(--text-body);padding:20px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{width:112px;border-radius:12px;overflow:hidden;border:1px solid var(--line-200)}.chip{height:64px}.meta{padding:7px 9px;background:var(--surface-card)}.name{font-weight:700;font-size:12.5px}.hex{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}.pill{display:flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;font-weight:700;font-size:13px}.dot{width:11px;height:11px;border-radius:999px}.surf{width:120px;height:52px;border-radius:12px;border:1px solid var(--line-200);display:flex;align-items:flex-end;padding:6px;font-size:11px;font-weight:700;color:var(--text-muted)}.grp{display:flex;gap:8px;flex-wrap:wrap}</style></head>
<body><div class="grp" style="margin-bottom:14px"><div class="pill" style="background:var(--success-soft);color:var(--success)"><span class="dot" style="background:var(--success)"></span>Sucesso</div><div class="pill" style="background:var(--warning-soft);color:var(--warning)"><span class="dot" style="background:var(--yellow-400)"></span>Atenção</div><div class="pill" style="background:var(--danger-soft);color:var(--danger)"><span class="dot" style="background:var(--danger)"></span>Erro</div><div class="pill" style="background:var(--info-soft);color:var(--info)"><span class="dot" style="background:var(--info)"></span>Info</div></div>
<div class="grp"><div class="surf" style="background:var(--surface-card)">surface-card</div><div class="surf" style="background:var(--bg-tint)">bg-tint</div><div class="surf" style="background:var(--bg-cream)">bg-cream</div><div class="surf" style="background:var(--surface-sunken)">sunken</div></div></body></html>
