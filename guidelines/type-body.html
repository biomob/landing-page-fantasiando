<!DOCTYPE html><html lang="pt-br"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-base);font-family:var(--font-body);color:var(--text-body);padding:22px 24px}
  .spec{display:flex;flex-direction:column;gap:12px;max-width:620px}
  .tag{font-size:11px;color:var(--text-subtle);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .eyebrow{font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
</style></head>
<body><div class="spec">
  <div>
    <div class="eyebrow">Prova virtual com IA</div>
    <p style="margin:6px 0 0;font-size:18px;line-height:1.6">Escolha o modelo, envie uma foto de corpo inteiro e veja uma prévia da criança usando a fantasia.</p>
  </div>
  <p style="margin:0;font-size:16px;line-height:1.5;color:var(--text-muted)">Body 16px / 1.5 — A prévia é uma simulação visual. Cores e caimento podem variar conforme a foto e o tamanho escolhido.</p>
  <p style="margin:0;font-size:13px;color:var(--text-subtle)">Small 14px — fine print, captions, helper text.</p>
</div></body></html>
