<!-- @dsCard group="Brand" viewport="700x420" name="Mascot system" subtitle="One heart-sun, eight variants — each maps to a UI moment" -->
<!DOCTYPE html><html lang="pt-br"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-tint);font-family:var(--font-body);color:var(--text-body);padding:20px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:8px}
  .well{width:100%;aspect-ratio:1;background:var(--surface-card);border-radius:var(--radius-organic);box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:center;padding:8px}
  .well img{max-width:100%;max-height:100%;object-fit:contain}
  .lbl{font-size:10.5px;font-weight:700;text-align:center;line-height:1.2}
</style></head>
<body><div class="grid">
  <div class="cell"><div class="well"><img src="../assets/mascote-estrela.png"></div><div class="lbl">Hero</div></div>
  <div class="cell"><div class="well"><img src="../assets/mascote-base.png"></div><div class="lbl">Brand</div></div>
  <div class="cell"><div class="well"><img src="../assets/mascote-prova-virtual.png"></div><div class="lbl">Try-on</div></div>
  <div class="cell"><div class="well"><img src="../assets/mascote-loading.png"></div><div class="lbl">Loading</div></div>
  <div class="cell"><div class="well"><img src="../assets/mascote-sucesso.png"></div><div class="lbl">Success</div></div>
  <div class="cell"><div class="well"><img src="../assets/mascote-vazio.png"></div><div class="lbl">Empty</div></div>
  <div class="cell"><div class="well"><img src="../assets/mascote-erro-foto.png"></div><div class="lbl">Error</div></div>
  <div class="cell"><div class="well"><img src="../assets/mascote-icone.png" alt="Rosto do mascote coração/sol"></div><div class="lbl">Ícone</div></div>
</div></body></html>
