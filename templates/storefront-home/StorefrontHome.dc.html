<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Storefront Home" description="Annapê home scaffold — top bar, header, hero with mascot, and featured products" -->
<helmet>
  <script src="./ds-base.js"></script>
  <style>
    @keyframes fzfloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    body { margin: 0; background: #FFF9F5; }
  </style>
</helmet>
<div style="font-family: 'Nunito', sans-serif; background: #FFF9F5; color: #3A3340;">

  <x-import component-from-global-scope="FantasiandoDesignSystem_43d79f.TopBar" hint-size="100%,38px"></x-import>
  <x-import component-from-global-scope="FantasiandoDesignSystem_43d79f.Header" assets-path="../../assets/" active="Vestidos" cart-count="2" hint-size="100%,76px"></x-import>

  <!-- Hero -->
  <section style="position: relative; overflow: hidden; background: linear-gradient(135deg, #F7EEFF 0%, #FFF1F8 48%, #FFF6EC 100%);">
    <div style="max-width: 1200px; margin: 0 auto; padding: 60px 24px 64px; display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 32px; align-items: center;">
      <div>
        <span style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; background: #E7DBFB; color: #5E33A2; font-weight: 700; font-size: 12.5px;"><span style="color:#8551D6;">★</span> 3 provas virtuais grátis por conta</span>
        <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 54px; line-height: 1.05; letter-spacing: -0.015em; color: #2B2533; margin: 16px 0 0;">A magia de escolher o vestido <span style="color: #8551D6;">antes da festa</span> começar.</h1>
        <p style="font-size: 18px; line-height: 1.6; color: #6A6072; max-width: 460px; margin: 18px 0 26px;">Escolha o modelo, envie uma foto de corpo inteiro e veja uma prévia da criança usando a fantasia antes de comprar.</p>
        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
          <x-import component-from-global-scope="FantasiandoDesignSystem_43d79f.Button" variant="primary" size="lg" hint-size="160px,56px">Ver vestidos</x-import>
          <x-import component-from-global-scope="FantasiandoDesignSystem_43d79f.Button" variant="accent" size="lg" hint-size="220px,56px">Testar prova virtual</x-import>
        </div>
      </div>
      <div style="position: relative; display: flex; justify-content: center; align-items: center;">
        <div style="position: absolute; width: 360px; height: 360px; border-radius: 50%; background: radial-gradient(circle, rgba(251,111,178,0.18), transparent 68%);"></div>
        <img src="../../assets/mascote-estrela.png" alt="Mascote de coração e sol da Annapê" style="position: relative; width: 340px; max-width: 100%; filter: drop-shadow(0 18px 30px rgba(58,29,37,0.18)); animation: fzfloat 5.5s ease-in-out infinite;">
      </div>
    </div>
  </section>

  <!-- Featured -->
  <section style="max-width: 1200px; margin: 0 auto; padding: 64px 24px;">
    <div style="font-weight: 800; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: #F24E9C;">Produtos em destaque</div>
    <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 34px; line-height: 1.12; color: #2B2533; margin: 8px 0 28px; letter-spacing: -0.01em;">Modelos que viram memória.</h2>
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px;">
      <sc-for list="{{ products }}" as="item" hint-placeholder-count="4">
        <x-import component-from-global-scope="FantasiandoDesignSystem_43d79f.ProductCard"
          name="{{ item.name }}" theme="{{ item.theme }}" price="{{ item.price }}"
          image="{{ item.image }}" sizes="{{ item.sizes }}" rating="{{ item.rating }}"
          reviews="{{ item.reviews }}" badge="{{ item.badge }}" hint-size="100%,460px"></x-import>
      </sc-for>
    </div>
  </section>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const A = '../../assets/';
    return {
      products: [
        { name: 'Vestido Princesa Aurora', theme: 'Princesas', price: 129.9, rating: 4.8, reviews: 32, sizes: ['2','4','6','8'], image: A + 'vestido-princesa-rosa.png', badge: { label: 'Mais vendido', tone: 'violet' } },
        { name: 'Vestido Floral Encantado', theme: 'Vestidos florais', price: 119.9, rating: 4.7, reviews: 21, sizes: ['2','4','6'], image: A + 'vestido-floral-rosa.png' },
        { name: 'Fantasia Arco-Íris', theme: 'Fantasia temática', price: 139.9, original: 169.9, rating: 4.9, reviews: 41, sizes: ['4','6','8','10'], image: A + 'vestido-arco-iris.png', badge: { label: '-18%', tone: 'yellow' } },
        { name: 'Vestido Tule Lilás', theme: 'Princesas', price: 149.9, rating: 4.8, reviews: 27, sizes: ['2','4','6','8'], image: A + 'vestido-princesa-rosa.png' },
      ],
    };
  }
}
</script>
</body>
</html>
