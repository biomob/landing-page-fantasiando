<!DOCTYPE html><html lang="pt-br"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg-base);font-family:var(--font-body);color:var(--text-body);padding:24px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .panel{background:var(--surface-card);border:1px solid var(--line-200);border-radius:var(--radius-lg);padding:18px 12px;box-shadow:var(--shadow-card)}
  .toasts{display:flex;gap:14px;flex-wrap:wrap;margin-top:20px}
</style></head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { MascotState, Toast, Button } = window.FantasiandoDesignSystem_43d79f;
  function App(){
    return (<>
      <div className="grid">
        <div className="panel"><MascotState state="empty" size="sm" assetsPath="../../assets/" /></div>
        <div className="panel"><MascotState state="loading" size="sm" progress={0.62} assetsPath="../../assets/" /></div>
        <div className="panel"><MascotState state="success" size="sm" assetsPath="../../assets/" /></div>
        <div className="panel"><MascotState state="error" size="sm" assetsPath="../../assets/" /></div>
        <div className="panel"><MascotState state="no-credits" size="sm" assetsPath="../../assets/" action={<Button variant="accent" size="sm">Chamar no WhatsApp</Button>} /></div>
        <div className="panel"><MascotState state="cart" size="sm" assetsPath="../../assets/" /></div>
      </div>
      <div className="toasts">
        <Toast tone="success" showMascot assetsPath="../../assets/" title="Adicionado ao carrinho" text="Vestido Princesa Aurora · Tam 6" onClose={()=>{}} />
        <Toast tone="info" showMascot assetsPath="../../assets/" title="Imagem excluída" text="Sua prévia foi removida da conta." onClose={()=>{}} />
      </div>
    </>);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
